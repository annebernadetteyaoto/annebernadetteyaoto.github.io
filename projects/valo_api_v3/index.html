
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Valorant Agents</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/valorant.png" type="image/x-icon">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="row my-5 align-items-center">
            <div class="col-auto">
                <img src="images/valorant-logo.png"
                    style="height: 50px;" alt="Valorant logo">
            </div>

            <div class="col">
                <h1 class="display-3">Agent List</h1>
            </div>
        </div>

        <!-- Search -->
        <div class="row mb-4">
            <div class="col-12 col-md-3 mb-2 mb-md-0">
                <select id="searchCategory" class="form-select">
                    <option value="any">Any</option>
                    <option value="agents">Agents</option>
                    <option value="role">Role</option>
                </select>
            </div>

            <div class="col">
                <input type="text" id="searchInput"
                    class="form-control" placeholder="Search agents...">
            </div>
        </div>

        <!-- Agent List -->
        <div class="row" id="agentContainer">
        </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
        <small>All rights reserved.</small>
    </footer>

    <script src="script.js"></script>

</body>
</html>
