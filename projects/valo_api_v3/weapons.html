<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Weapons | Valorant Database</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="weapons.css">

    <link rel="icon" href="../../images/valorant.png" type="image/x-icon">
</head>

<body>

    <main class="container weapons-page">

        <header class="row my-5 align-items-center">

            <div class="col-auto">
                <img src="../../images/valorant-logo.png"
                    class="logo"
                    alt="Valorant logo">
            </div>

            <div class="col">
                <h1 class="display-3">Weapons</h1>
            </div>

        </header>

        <div class="mb-4">
            <a href="index.html" class="back-button">
                &larr; Back to Database
            </a>
        </div>

        <section>

            <h2 class="section-title mb-4">Weapon Catalogue</h2>

            <!-- Search and Filter -->
            <div class="row mb-4">

                <div class="col-12 col-md mb-2">
                    <input type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search weapons...">
                </div>

                <div class="col-12 col-md-4">
                    <select id="categoryFilter" class="form-select">
                        <option value="all">All Categories</option>
                    </select>
                </div>

            </div>

            <!-- Weapon List -->
            <div class="row" id="weaponContainer">

                <div class="col-12 text-center my-5">
                    <p>Loading weapons...</p>
                </div>

            </div>

        </section>

    </main>

    <footer class="footer">
        <p>
            © <span id="currentYear"></span> VALORANT.
            All rights reserved.
        </p>

        <p>
            This is a fan-made project and is not affiliated with Riot Games.
        </p>
    </footer>

    <script src="weapons.js"></script>

</body>
</html>
