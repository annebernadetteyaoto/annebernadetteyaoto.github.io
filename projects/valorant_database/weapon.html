<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Weapon Details | Valorant Database</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="weapon.css">

    <link rel="icon" href="../../images/valorant.png" type="image/x-icon">
</head>

<body>

    <main class="container weapon-page">

        <!-- Header -->
        <header class="row my-5 align-items-center">

            <div class="col-auto">
                <img src="../../images/valorant-logo.png"
                    class="logo"
                    alt="Valorant logo">
            </div>

            <div class="col">
                <h1 class="display-3">Weapon Details</h1>
            </div>

        </header>

        <!-- Back Navigation -->
        <div class="mb-4">
            <a href="weapons.html" class="back-button">
                &larr; Back to Weapons
            </a>
        </div>

        <!-- Weapon Profile -->
        <section class="weapon-profile">

            <div class="weapon-portrait">
                <img id="weaponImage" alt="Weapon image">
            </div>

            <div class="weapon-information">

                <span class="profile-label">WEAPON PROFILE</span>

                <h1 id="weaponName"></h1>

                <span id="weaponCategory" class="weapon-category"></span>

                <p id="weaponPrice" class="weapon-price"></p>

            </div>

        </section>

        <!-- Weapon Stats -->
        <section class="weapon-section">

            <div class="weapon-section-heading">
                <span class="profile-label">WEAPON INFORMATION</span>
                <h2>Weapon Stats</h2>
            </div>

            <div class="stats-grid" id="weaponStats">

                <p>Loading weapon stats...</p>

            </div>

        </section>

        <!-- Damage Ranges -->
        <section class="weapon-section" id="damageSection">

            <div class="weapon-section-heading">
                <span class="profile-label">COMBAT INFORMATION</span>
                <h2>Damage Ranges</h2>
            </div>

            <div class="table-responsive">

                <table class="table damage-table">

                    <thead>
                        <tr>
                            <th>Range</th>
                            <th>Head</th>
                            <th>Body</th>
                            <th>Leg</th>
                        </tr>
                    </thead>

                    <tbody id="damageRanges"></tbody>

                </table>

            </div>

        </section>

        <!-- Weapon Skins -->
        <section class="weapon-section">

            <div class="weapon-section-heading">
                <span class="profile-label">CUSTOMIZATION</span>
                <h2>Weapon Skins</h2>
            </div>

            <button class="skins-toggle"
                id="skinsToggle"
                type="button"
                aria-expanded="false"
                aria-controls="skinsContainer">

                Show Skins
                <span id="skinsArrow">+</span>

            </button>

            <div id="skinsContainer" class="skins-container" hidden>

                <div class="row" id="skinsList"></div>

            </div>

        </section>

    </main>

    <footer class="footer">

        <p>
            © <span id="currentYear"></span> VALORANT.
            All rights reserved.
        </p>

        <p>
            This is a fan-made project and is not affiliated with Riot Games.
        </p>

    </footer>

    <script src="weapon.js"></script>

</body>
</html>
