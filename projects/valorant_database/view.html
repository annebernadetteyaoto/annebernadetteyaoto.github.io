
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Agent Details | Valorant Database</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body class="agent-detail">

    <main class="container agent-page">

        <!-- Back Button -->
        <div class="back-navigation">
            <a href="index.html" class="back-button">
                &larr; Back to Agents
            </a>
        </div>

        <!-- Agent Profile -->
        <section class="agent-profile">

            <!-- Agent Portrait -->
            <div class="agent-portrait">
                <img id="agentImage" alt="Agent portrait">
            </div>

            <!-- Agent Information -->
            <div class="agent-information">

                <span class="profile-label">AGENT PROFILE</span>

                <h1 id="title"></h1>

                <div id="agentRole" class="agentRole"></div>

                <div id="description"></div>

            </div>

        </section>

        <!-- Abilities -->
        <section class="agent-abilities">

            <div class="abilities-heading">
                <span class="profile-label">CHARACTER OVERVIEW</span>
                <h2>Abilities</h2>
            </div>

            <!-- Regular Abilities -->
            <div class="ability-group">
                <h3>Basic Abilities</h3>
                <div class="ability-list" id="regularAbilities"></div>
            </div>

            <!-- Ultimate -->
            <div class="ability-group">
                <h3>Ultimate</h3>
                <div class="ability-list" id="ultimateAbility"></div>
            </div>

            <!-- Passive -->
            <div class="ability-group" id="passiveGroup">
                <h3>Passive</h3>
                <div class="ability-list" id="passiveAbility"></div>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>
            © <span id="currentYear"></span> VALORANT.
            All rights reserved.
        </p>
        <p>
            This is a fan-made project and is not affiliated with Riot Games.
        </p>
    </footer>

    <script src="script2.js"></script>

</body>
</html>
